
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signed In</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-image: url("9.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            color: #fff;
        }

        /* Navigation Bar */
        nav {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            padding: 20px 15px;
        }

        nav a {
            text-decoration: none;
            color: white;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            transition: 0.3s;
        }

        nav a:hover {
            background: #B6779B;
            color: black;
        }

        /* Main Content */
        .container {
            min-height: 75vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px 20px;
            background: rgba(0, 0, 0, 0.25);
        }

        h1 {
            font-size: 45px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 5px black;
            overflow-wrap: break-word;
        }

        p {
            font-size: 20px;
            font-weight: bold;
            line-height: 1.6;
            text-shadow: 1px 1px 4px black;
        }

        /* Logout */
        .logout {
            padding: 15px;
        }

        /* Responsive Design for Cellphones */
        @media screen and (max-width: 600px) {
            body {
                background-position: center;
                background-attachment: scroll;
            }

            nav {
                gap: 8px;
                padding: 15px 10px;
            }

            nav a {
                font-size: 14px;
                padding: 9px 12px;
            }

            .container {
                min-height: 65vh;
                padding: 25px 15px;
            }

            h1 {
                font-size: 28px;
                line-height: 1.3;
                margin-bottom: 15px;
            }

            p {
                font-size: 16px;
                line-height: 1.5;
            }

            .logout {
                padding: 10px;
            }
        }

        /* Extra Small Cellphones */
        @media screen and (max-width: 360px) {
            nav {
                gap: 6px;
                padding: 10px 6px;
            }

            nav a {
                font-size: 12px;
                padding: 8px 10px;
            }

            h1 {
                font-size: 24px;
            }

            p {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

        <a href="home.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="login.html">Login</a>
        <a href="Product.html">Product</a>
        <a href="film.html">Films</a>
    </nav>

    <div class="container">
        <h1>WELCOME TO OUR JEWELRY COLLECTION</h1>

        <p>
            Decorative items worn on the body for personal adornment,
            typically crafted from precious metals and gemstones.
        </p>
    </div>

    <nav class="logout">
        <a href="logini.html">Log Out</a>
    </nav>

</body>
</html>
