<html lang="en">
 <head>
 <title>LOGIN FORM </title>
 <style> 
  * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url("8.jpg");
            background-size: cover;
            background-position: center;
        }
        .login-box {
            width: 350px;
            padding: 35px;

            border: 1px solid rgba(255,255,255,0.4);

            text-align: center;

        }
        /* Style for your new logo */
        .login-logo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin-bottom: 15px;
            object-fit: cover;
        }
        h1 {
            margin-bottom: 25px;
            margin-top: 0;
            font-size: 24px;
        }
        input {
            width: 100%;
            padding: 13px;
            margin: 10px 0;
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.5);
            border-radius: 8px;
            color: white;
            outline: none;
        }
        input::placeholder {
            color: white;
        }
        button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            background: white;
            color: black;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }


</style>
