<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LOGIN FORM</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: url("8.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* Login Box */
        .login-box {
            width: 100%;
            max-width: 350px;
            padding: 35px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 15px;
            text-align: center;
            color: white;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
        }

        /* Logo */
        .login-logo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin-bottom: 15px;
            object-fit: cover;
        }

        h1 {
            margin: 0 0 25px;
            font-size: 24px;
        }

        /* Input Fields */
        .input-group {
            text-align: left;
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            display: block;
            width: 100%;
            min-width: 0;
            padding: 13px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 8px;
            color: white;
            outline: none;
            font-size: 16px;
        }

        input::placeholder {
            color: white;
            opacity: 0.85;
        }

        input:focus {
            border-color: white;
            background: rgba(255, 255, 255, 0.3);
        }

        /* Login Button */
        button {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            background: white;
            color: black;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: 0.3s;
        }

        button:hover {
            background: #DE7DB4;
            color: white;
        }

        .error-message {
            color: #fff;
            font-size: 14px;
            margin-top: 15px;
        }

        /* Cellphone Responsive */
        @media screen and (max-width: 480px) {
            body {
                padding: 15px;
                background-position: center;
            }

            .login-box {
                width: 100%;
                max-width: 350px;
                padding: 25px 20px;
                border-radius: 12px;
            }

            .login-logo {
                width: 70px;
                height: 70px;
            }

            h1 {
                font-size: 22px;
                margin-bottom: 20px;
            }

            input {
                padding: 12px;
                font-size: 16px;
            }

            button {
                padding: 13px;
                font-size: 16px;
            }
        }

        /* Extra Small Cellphones */
        @media screen and (max-width: 320px) {
            .login-box {
                padding: 20px 15px;
            }

            h1 {
                font-size: 20px;
            }

            .login-logo {
                width: 60px;
                height: 60px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">
        <div class="login-box">

            <img src="10.jpg" alt="Jewelry Logo" class="login-logo">

            <h1>LOGIN FORM</h1>

            <form id="loginForm">

                <div class="input-group">
                    <label for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter Username"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter Password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button type="submit">Log In</button>

                <p id="error-message" class="error-message"></p>

            </form>
        </div>
    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", function(event) {
            event.preventDefault();

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            // Sample login credentials
            if (username === "nicky" && password === "20004") {
                window.location.href = "home.html";
            } else {
                document.getElementById("error-message").textContent =
                    "Incorrect username or password. Please try again.";
            }
        });
    </script>

</body>
</html>
